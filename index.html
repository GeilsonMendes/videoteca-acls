<title>AHA ACLS · Videoteca</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F5F3F0;--surface:#FFFFFF;--ink:#1B1B1F;--muted:#62626A;--line:#E3E0DB;--accent:#C8102E;--accent-ink:#FFFFFF;--err:#B42318;--err-soft:#FDECEA}
@media (prefers-color-scheme:dark){:root{--bg:#0F1012;--surface:#1A1B1F;--ink:#EDEEF0;--muted:#A0A3AB;--line:#30333A;--accent:#FF5A6E;--accent-ink:#1A0508;--err:#FF8A80;--err-soft:#3A1A1A}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.card{position:relative;overflow:hidden;width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px 26px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.ecg{position:absolute;left:0;right:0;top:18px;width:100%;height:60px;fill:none;stroke:var(--accent);stroke-width:2;opacity:.12;pointer-events:none}
.logo{width:52px;height:52px;display:block;margin-bottom:18px}
h1{margin:0;font-size:1.45rem;letter-spacing:-.02em;font-weight:800}
.sub{margin:6px 0 24px;color:var(--muted);font-size:.92rem;line-height:1.45}
label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px}
.field{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:1rem;padding:12px 44px 12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.eye{all:unset;cursor:pointer;position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.eye:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:.86rem;color:var(--muted)}
.row input{width:16px;height:16px;accent-color:var(--accent)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;text-align:center;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:13px;border-radius:12px;font-size:.95rem}
.btn[disabled]{opacity:.6;cursor:wait}
.msg{margin:14px 0 0;padding:10px 12px;border-radius:10px;font-size:.86rem;background:var(--err-soft);color:var(--err)}
.foot{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted);line-height:1.5}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<main class="card" id="card">
  <svg class="ecg" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 34h150l8-14 8 26 10-40 10 30 6-2h208"/></svg>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="var(--accent)"/><path fill="#fff" d="M24 38S10 30 10 20a7.5 7.5 0 0 1 14-3.5A7.5 7.5 0 0 1 38 20c0 10-14 18-14 18z"/><path d="M12 24h7l2.5-5 3.5 10 2.5-5H36" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
  <h1>Videoteca AHA ACLS</h1>
  <p class="sub">Acesso restrito aos participantes do curso. Informe a senha da turma para continuar.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="videoteca-acls" autocomplete="username" hidden>
    <label for="pw">Senha de acesso</label>
    <div class="field">
      <input type="password" id="pw" autocomplete="current-password" required autofocus>
      <button type="button" class="eye" id="eye" aria-label="Mostrar senha"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <label class="row" for="keep"><input type="checkbox" id="keep" checked> Manter acesso neste navegador</label>
    <button class="btn" id="go" type="submit">Entrar</button>
    <p class="msg" id="msg" role="alert" hidden></p>
  </form>
  <p class="foot">O conteúdo desta página é protegido por criptografia (AES-256). Os vídeos também exigem acesso à pasta do curso no Google Drive.</p>
</main>

var KEY='aha-acls-chave';
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function toB64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  var html=new TextDecoder().decode(plain);
  document.open();document.write(html);document.close();
}
async function tryStored(){
  try{var raw=localStorage.getItem(KEY)||sessionStorage.getItem(KEY);if(!raw)return;
    var key=await crypto.subtle.importKey('raw',b64(raw),{name:'AES-GCM'},true,['decrypt']);
    await openWith(key);}catch(e){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);}catch(_){}}
}
var f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg'),card=document.getElementById('card');
document.getElementById('eye').onclick=function(){pw.type=pw.type==='password'?'text':'password';this.setAttribute('aria-label',pw.type==='password'?'Mostrar senha':'Ocultar senha');pw.focus();};
f.addEventListener('submit',async function(e){
  e.preventDefault();msg.hidden=true;go.disabled=true;go.textContent='Verificando…';
  try{
    var key=await derive(pw.value);
    var raw=toB64(await crypto.subtle.exportKey('raw',key));
    try{(document.getElementById('keep').checked?localStorage:sessionStorage).setItem(KEY,raw);}catch(_){}
    await openWith(key);
  }catch(err){
    go.disabled=false;go.textContent='Entrar';
    msg.textContent='Senha incorreta. Confira com o coordenador do curso e tente novamente.';msg.hidden=false;
    card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');pw.select();
  }
});
tryStored();
})();
